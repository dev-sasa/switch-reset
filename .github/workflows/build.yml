name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: switch_reset-windows.exe
            file: dist/switch_reset.exe
          - os: macos-latest
            asset: switch_reset-macos
            file: dist/switch_reset
          - os: ubuntu-latest
            asset: switch_reset-linux
            file: dist/switch_reset
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyserial pyinstaller
      - run: pyinstaller --onefile --console --name switch_reset switch_reset.py
      - name: Rename binary
        shell: bash
        run: cp "${{ matrix.file }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # Runs only when a version tag like v1.0.0 is pushed.
  # Creates a GitHub Release with the three downloads.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
